name: Release (Android)

on:
  push:
    tags:
      - 'book-reader-v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Build APK + publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG##*-v}"
          TOOL="${TAG%-v*}"
          if [ "$TOOL" != "book-reader" ]; then
            echo "release-android.yml only handles book-reader-v*.*.* tags (got '$TAG')" >&2
            exit 1
          fi
          echo "tool=$TOOL"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "src=android/book-reader" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ steps.parse.outputs.src }}/.gradle
            ${{ steps.parse.outputs.src }}/build
            ${{ steps.parse.outputs.src }}/app/build
          key: book-reader-gradle-${{ hashFiles(format('{0}/**/*.gradle*', steps.parse.outputs.src), format('{0}/**/gradle-wrapper.properties', steps.parse.outputs.src)) }}
          restore-keys: |
            book-reader-gradle-

      - name: Build debug APK
        working-directory: ${{ steps.parse.outputs.src }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK + sha256
        env:
          TOOL: ${{ steps.parse.outputs.tool }}
          VERSION: ${{ steps.parse.outputs.version }}
          SRC: ${{ steps.parse.outputs.src }}
        run: |
          APK_SRC="${SRC}/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "APK not built at expected path: $APK_SRC" >&2
            ls -lah "${SRC}/app/build/outputs/apk/" || true
            exit 1
          fi
          APK="${TOOL}-${VERSION}.apk"
          cp "$APK_SRC" "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Build release notes
        env:
          TOOL: ${{ steps.parse.outputs.tool }}
          VERSION: ${{ steps.parse.outputs.version }}
          SRC: ${{ steps.parse.outputs.src }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          DESC=""
          if [ -f "${SRC}/README.md" ]; then
            DESC=$(awk '/^## /{exit} /^# [^#]/{found=1; next} found && /^[^[:space:]]/{print; exit}' "${SRC}/README.md")
          fi

          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          {
            echo "## ${TOOL} v${VERSION}"
            echo
            [ -n "$DESC" ] && { echo "$DESC"; echo; }
            echo "## Install (Android)"
            echo
            echo "Sideload the APK on Android 8.0+ (API 26+):"
            echo
            echo '```bash'
            echo "curl -LO ${BASE_URL}/${TOOL}-${VERSION}.apk"
            echo "curl -LO ${BASE_URL}/${TOOL}-${VERSION}.apk.sha256"
            echo "sha256sum -c ${TOOL}-${VERSION}.apk.sha256"
            echo "adb install ${TOOL}-${VERSION}.apk      # via USB / wireless ADB"
            echo '```'
            echo
            echo "Or transfer the .apk to the phone (Files / Drive / cable) and tap to install."
            echo "Enable **Settings → Apps → Special access → Install unknown apps** for the source app."
            echo
            echo "## Verify checksum"
            echo
            echo '```bash'
            echo "sha256sum -c ${TOOL}-${VERSION}.apk.sha256"
            echo '```'
            echo
            echo "> This release ships the **unsigned debug APK** — fine for personal sideloading. Production-signed releases require an Android keystore secret (\`ANDROID_KEYSTORE_B64\`) and a \`signingConfigs\` block in \`app/build.gradle.kts\`; not enabled in this workflow."
          } > release_body.md

          echo "----- release notes -----"
          cat release_body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ steps.parse.outputs.tool }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${TOOL} v${VERSION}" \
            --notes-file release_body.md \
            "${APK}" \
            "${APK}.sha256"
